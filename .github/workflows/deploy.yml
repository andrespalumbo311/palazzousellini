name: Deploy Palazzo Usellini to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo Extended
        env:
          HUGO_VERSION: '0.166.0'
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build static site
        run: hugo --minify

      - name: Deploy via SFTP (lftp mirror)
        env:
          HETZNER_SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
          HETZNER_SFTP_USER: ${{ secrets.HETZNER_SFTP_USER }}
          HETZNER_SFTP_PASSWORD: ${{ secrets.HETZNER_SFTP_PASSWORD }}
          HETZNER_SFTP_PORT: ${{ secrets.HETZNER_SFTP_PORT || '22' }}
          HETZNER_REMOTE_DIR: ${{ secrets.HETZNER_REMOTE_DIR }}
        run: |
          sudo apt-get install -yqq lftp > /dev/null 2>&1
          lftp -u "${HETZNER_SFTP_USER},${HETZNER_SFTP_PASSWORD}" \
            sftp://${HETZNER_SFTP_HOST}:${HETZNER_SFTP_PORT} -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --parallel=10 --no-perms --verbose \
              ./public ${HETZNER_REMOTE_DIR};
            quit"
