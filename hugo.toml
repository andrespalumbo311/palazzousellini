      url = '/news/'
      weight = 4
    [[languages.it.menu.main]]
      name = 'Contatti'
      url = '/contatti/'
      weight = 5

  [languages.en]
    locale = 'en-US'
    label = 'EN'
    weight = 2
    title = 'Palazzo Usellini'
    [languages.en.params]
      description = 'Historic 18th-century palace in Arona on Lake Maggiore. Venue for classical concerts, cultural events, and art exhibitions.'
