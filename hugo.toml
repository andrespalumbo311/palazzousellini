baseURL = 'https://palazzousellini.com/'
defaultContentLanguage = 'it'
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.it]
    locale = 'it-IT'
    label = 'IT'
    weight = 1
    title = 'Palazzo Usellini'
    [languages.it.params]
      description = 'Dimora storica del Settecento ad Arona sul Lago Maggiore. Sede di concerti, eventi culturali e mostre.'
      address = 'Via Pertossi 12, 28041 Arona (NO)'
    [[languages.it.menu.main]]
      name = 'Home'
      url = '/'
      weight = 1
    [[languages.it.menu.main]]
      name = 'Storia'
      url = '/storia/'
      weight = 2
    [[languages.it.menu.main]]
      name = 'Galleria'
      url = '/galleria/'
